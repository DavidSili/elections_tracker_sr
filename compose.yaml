services:
  elections:
    image: elections-tracker-sr:local
    build: .
    ports:
      - '8080:80'
    env_file:
      - .env
    environment:
      TZ: Europe/Belgrade
    volumes:
      - election-data:/var/www/html/storage
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  election-data:
